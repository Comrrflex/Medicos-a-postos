# Medicos a Postos — Render Blueprint
# Plan: starter (smallest paid plan that supports persistent disks).
# Free cannot attach disks; SQLite needs /data persistence for commercial use.
# runtime: docker (Node native falha sqlite3/GLIBC no Runtime Render).
services:
  - type: web
    name: medicos-a-postos
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_PATH
        value: /data/clinical.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
